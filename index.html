<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя ♡</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f9;--ink:#4a1f2e;--soft:#a35a74;--pink:#ff7fa6;--rose:#ffd6e3;--card:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1219;--ink:#ffe9f0;--soft:#e8a0b8;--rose:#5a2a3a;--card:#3a1b26;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;min-height:100%}
.serif{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#hearts i{position:absolute;bottom:-40px;color:var(--pink);opacity:.35;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
section{position:relative;z-index:1}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.hero h1{font-size:clamp(64px,22vw,150px);line-height:.95;color:var(--pink);text-shadow:0 8px 40px rgba(255,127,166,.45)}
.hero p{margin-top:18px;color:var(--soft);font-size:17px;max-width:30ch;line-height:1.5}
.down{margin-top:44px;font-size:30px;color:var(--pink);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(10px)}}
.feed{display:flex;flex-direction:column;gap:46px;align-items:center;padding:30px 22px 90px}
.polaroid{width:min(320px,86vw);background:var(--card);padding:12px 12px 16px;border-radius:6px;box-shadow:0 18px 40px rgba(255,127,166,.3);border:0;cursor:pointer;color:var(--ink);transform:rotate(var(--r));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.polaroid:active{transform:rotate(0) scale(.97)}
.polaroid img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:var(--pos,center);border-radius:3px}
.polaroid span{display:block;margin-top:12px;font-size:21px;text-align:center}
.polaroid small{display:block;margin-top:2px;color:var(--soft);font-size:13px;text-align:center}
.end{min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.end h2{font-size:clamp(44px,14vw,90px);color:var(--pink);line-height:1.05}
.end button{margin-top:30px;border:0;border-radius:99px;padding:15px 30px;background:var(--pink);color:#fff;font:600 16px Manrope,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(255,127,166,.5)}
#m{position:fixed;inset:0;z-index:5;background:var(--bg);overflow-y:auto;visibility:hidden;opacity:0;transition:opacity .4s,visibility .4s;padding-bottom:env(safe-area-inset-bottom,0px)}
#m.on{visibility:visible;opacity:1}
#m .ph{height:78svh;position:relative;overflow:hidden;transform:scale(1.2);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
#m.on .ph{transform:scale(1)}
#m .ph img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,center)}
#m .ph:after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--bg))}
#x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:6;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#c2456f;font-size:22px;cursor:pointer;display:none}
#m.on~#x{display:block}
.arrow{text-align:center;font-size:34px;color:var(--pink);margin:-40px 0 6px;position:relative;animation:bob 1.6s ease-in-out infinite}
.wishes{padding:10px 26px 100px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;max-width:520px;margin:auto}
.w{font-size:clamp(26px,8vw,38px);line-height:1.2;color:var(--ink);opacity:0;transform:translateY(40px);transition:all .8s cubic-bezier(.2,.8,.2,1)}
.w.in{opacity:1;transform:none}
.a{font-size:26px;color:var(--pink);opacity:0;transition:opacity .8s;margin:14px 0}
.a.in{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="hearts"></div>
<section class="hero">
<h1 class="serif">Для тебя</h1>
<p>Здесь немного слов о том, что я чувствую рядом с тобой. Нажимай на фотографии.</p>
<div class="down">↓</div>
</section>
<section class="feed" id="feed"></section>
<section class="end">
<h2 class="serif">Я люблю тебя</h2>
<button id="again">Ещё раз ♡</button>
</section>
<div id="m"><div class="ph"><img id="mi" alt=""></div><div class="arrow">↓</div><div class="wishes" id="ws"></div></div>
